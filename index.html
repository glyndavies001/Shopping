<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d120c">
<title>Trolley</title>
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d120c;
    --surface: #161d15;
    --surface2: #1f2a1d;
    --border: #2a3528;
    --accent: #4a6b3e;          /* Jungle Wood Green */
    --accent-bright: #6a8f5a;   /* lifted version for hover/active */
    --accent-dim: rgba(74, 107, 62, 0.18);
    --muted: #4a5648;
    --text: #e4e8e0;
    --text-dim: #889384;
    --collected: #2a3528;
    --danger: #c45050;
    --warning: #d4a854;
    --radius: 10px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  /* CONFIG SCREEN */
  .config-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .config-screen.hidden { display: none; }

  .config-card {
    max-width: 360px;
    width: 100%;
  }

  .config-card h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 32px;
    color: var(--accent-bright);
    margin-bottom: 8px;
  }

  .config-card p {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .config-card label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 6px;
    margin-top: 14px;
  }

  .config-card input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
  }

  .config-card input:focus { border-color: var(--accent-bright); }

  .config-card button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border-radius: var(--radius);
    background: var(--accent);
    border: none;
    color: #fff;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }

  .config-card button:disabled { opacity: 0.4; cursor: not-allowed; }

  .config-status {
    margin-top: 12px;
    font-size: 12px;
    text-align: center;
    min-height: 16px;
  }

  .config-status.error { color: var(--danger); }
  .config-status.ok { color: var(--accent-bright); }

  /* HEADER */
  header {
    padding: 18px 20px 0;
    flex-shrink: 0;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: -0.5px;
    color: var(--accent-bright);
  }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .sync-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }

  .sync-dot.connected {
    background: var(--accent-bright);
    box-shadow: 0 0 8px var(--accent);
  }

  .sync-dot.syncing {
    background: var(--warning);
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* MAIN TABS (Trip / Master / History) */
  .main-tabs {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3px;
    margin-top: 10px;
    margin-bottom: 12px;
  }

  .main-tab {
    flex: 1;
    padding: 9px;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    background: none;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .main-tab.active {
    background: var(--accent);
    color: #fff;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    gap: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-val {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--text);
    line-height: 1;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .progress-track {
    height: 2px;
    background: var(--border);
    border-radius: 99px;
    margin-top: 8px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent-bright);
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* SUB-TABS (within trip view) */
  .sub-tabs {
    display: flex;
    padding: 10px 20px 0;
    flex-shrink: 0;
  }

  .sub-tab {
    flex: 1;
    padding: 7px;
    text-align: center;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    background: none;
    border: none;
    border-bottom: 2px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
  }

  .sub-tab.active {
    color: var(--accent-bright);
    border-bottom-color: var(--accent-bright);
  }

  /* LIST */
  .list-wrap {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 20px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  .list-wrap::-webkit-scrollbar { display: none; }

  .section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    padding: 12px 0 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 6px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .item::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent-bright);
    transform: scaleY(0);
    transform-origin: center;
    transition: transform 0.2s;
    border-radius: 0 3px 3px 0;
  }

  .item:active { transform: scale(0.98); }

  .item.collected {
    background: var(--collected);
    border-color: transparent;
    opacity: 0.55;
  }

  .item.collected::before { transform: scaleY(1); }

  .check-box {
    width: 22px;
    height: 22px;
    border: 2px solid var(--border);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .item.collected .check-box {
    background: var(--accent-bright);
    border-color: var(--accent-bright);
  }

  .check-icon {
    opacity: 0;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
  }

  .item.collected .check-icon { opacity: 1; }

  .item-body {
    flex: 1;
    min-width: 0;
  }

  .item-name {
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item.collected .item-name {
    color: var(--text-dim);
    text-decoration: line-through;
  }

  .item-meta {
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Quantity badge */
  .qty-badge {
    background: var(--accent-dim);
    color: var(--accent-bright);
    border: 1px solid var(--accent);
    border-radius: 99px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 500;
    flex-shrink: 0;
  }

  /* Inline quantity controls (master list) */
  .qty-controls {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--surface2);
    border-radius: 99px;
    padding: 2px;
  }

  .qty-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }

  .qty-btn:active { transform: scale(0.9); }

  .qty-val {
    min-width: 24px;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
  }

  .need-btn {
    padding: 6px 14px;
    border-radius: 99px;
    border: 1px solid var(--accent);
    background: var(--accent-dim);
    color: var(--accent-bright);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    text-transform: uppercase;
  }

  .need-btn:active {
    background: var(--accent);
    color: #fff;
    transform: scale(0.96);
  }

  .need-btn.on-list {
    background: var(--accent);
    color: #fff;
  }

  .item-actions {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .btn-icon {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-icon:active { transform: scale(0.9); }
  .btn-icon.danger:active { background: var(--danger); color: white; border-color: var(--danger); }

  .need-more-btn {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: none;
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .need-more-btn.active {
    background: rgba(196, 80, 80, 0.15);
    border-color: var(--danger);
    color: var(--danger);
  }

  /* ADD AREA */
  .add-area {
    padding: 10px 20px;
    padding-bottom: calc(10px + var(--safe-bottom));
    background: var(--bg);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .add-row {
    display: flex;
    gap: 8px;
  }

  .add-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
  }

  .add-input::placeholder { color: var(--muted); }
  .add-input:focus { border-color: var(--accent-bright); }

  .add-btn {
    width: 46px;
    height: 46px;
    border-radius: var(--radius);
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .add-btn:active { transform: scale(0.92); }

  .actions-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .action-btn {
    flex: 1;
    padding: 9px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    text-align: center;
    letter-spacing: 0.03em;
    -webkit-tap-highlight-color: transparent;
  }

  .action-btn:active { opacity: 0.7; }

  .action-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-dim);
  }

  .empty-icon {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.4;
  }

  .empty-title {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .empty-sub {
    font-size: 12px;
    color: var(--muted);
  }

  /* SEARCH (master list) */
  .search-row {
    padding: 8px 20px 0;
    flex-shrink: 0;
  }

  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
  }

  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent-bright); }

  /* HISTORY / STATS */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }

  .stats-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }

  .stats-card-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .stats-card-val {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 24px;
    color: var(--accent-bright);
    line-height: 1.1;
  }

  .stats-card-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  .trip-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 8px;
  }

  .trip-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    cursor: pointer;
  }

  .trip-date {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
  }

  .trip-summary {
    font-size: 11px;
    color: var(--text-dim);
  }

  .trip-items {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .trip-card.expanded .trip-items { display: block; }

  .trip-item-line {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 12px;
  }

  .trip-item-name { color: var(--text); }
  .trip-item-qty { color: var(--text-dim); }

  .trip-delete {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 11px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    -webkit-tap-highlight-color: transparent;
  }

  .trip-delete:hover { background: rgba(196, 80, 80, 0.1); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 110px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 99px;
    font-size: 12px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* TRIP COMPLETE MODAL */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 32px;
    backdrop-filter: blur(8px);
  }

  .modal-bg.show { display: flex; }

  .modal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    text-align: center;
    max-width: 320px;
    width: 100%;
  }

  .modal-card h2 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 28px;
    color: var(--accent-bright);
    margin-bottom: 8px;
  }

  .modal-card p {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 24px;
    line-height: 1.5;
  }

  .modal-card button {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius);
    background: var(--accent);
    border: none;
    color: #fff;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }

  .modal-card button.secondary {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    margin-top: 8px;
  }

  .settings-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px;
    font-size: 16px;
  }
</style>
</head>
<body>

<div class="config-screen" id="configScreen">
  <div class="config-card">
    <h1>trolley</h1>
    <p>Connect to your Supabase project to start syncing your shared shopping list across devices.</p>
    <label>Supabase URL</label>
    <input type="text" id="cfgUrl" placeholder="https://xxxxx.supabase.co" autocomplete="off">
    <label>Anon Key</label>
    <input type="text" id="cfgKey" placeholder="eyJhbG..." autocomplete="off">
    <button id="cfgConnect" onclick="connect()">connect</button>
    <div class="config-status" id="cfgStatus"></div>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="header-top">
      <div class="logo">trolley</div>
      <div class="header-meta">
        <span class="sync-dot" id="syncDot"></span>
        <button class="settings-btn" onclick="openSettings()" title="settings">⚙</button>
      </div>
    </div>

    <div class="main-tabs">
      <button class="main-tab active" id="viewTrip" onclick="setView('trip')">Trip</button>
      <button class="main-tab" id="viewMaster" onclick="setView('master')">Master</button>
      <button class="main-tab" id="viewHistory" onclick="setView('history')">History</button>
    </div>

    <!-- Stats bar (visible on trip view) -->
    <div class="stats-bar" id="tripStats">
      <div class="stat">
        <div class="stat-val" id="statTotal">0</div>
        <div class="stat-label">items</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statQty">0</div>
        <div class="stat-label">total qty</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statCollected">0</div>
        <div class="stat-label">collected</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statNeedMore">0</div>
        <div class="stat-label">need more</div>
      </div>
    </div>
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </header>

  <!-- Sub-tabs only relevant on trip view -->
  <div class="sub-tabs" id="subTabs">
    <button class="sub-tab active" id="tabAll" onclick="setTab('all')">All</button>
    <button class="sub-tab" id="tabNeeded" onclick="setTab('needed')">Need More</button>
    <button class="sub-tab" id="tabCollected" onclick="setTab('collected')">Collected</button>
  </div>

  <!-- Search bar (master view) -->
  <div class="search-row" id="searchRow" style="display:none">
    <input class="search-input" id="searchInput" placeholder="search master list..." oninput="render()">
  </div>

  <div class="list-wrap" id="listWrap"></div>

  <!-- Add area (changes label based on view) -->
  <div class="add-area">
    <div class="add-row">
      <input class="add-input" id="addInput" placeholder="add to master list..." maxlength="60"
        onkeydown="if(event.key==='Enter')addItem()">
      <button class="add-btn" onclick="addItem()">+</button>
    </div>
    <div class="actions-row" id="actionsRow">
      <button class="action-btn" onclick="clearCollected()">clear collected</button>
      <button class="action-btn primary" onclick="completeTrip()">finish trip →</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-bg" id="tripComplete">
  <div class="modal-card">
    <div style="font-size:40px;margin-bottom:12px">🛒</div>
    <h2>trip done!</h2>
    <p id="tripSummary">All items collected. Trolley has updated its route.</p>
    <button onclick="confirmCompleteTrip()">save trip</button>
    <button class="secondary" onclick="closeTripComplete()">keep shopping</button>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ─── STATE ────────────────────────────────────────────────────────────────────

let supabase = null;
let state = {
  master: [],         // master_items rows
  current: [],        // current_list rows
  orderMap: {},
  trips: [],
};
let currentView = 'trip';    // 'trip' | 'master' | 'history'
let currentTab = 'all';       // (trip view) 'all' | 'needed' | 'collected'
let currentTripOrder = 0;

// ─── CONFIG ───────────────────────────────────────────────────────────────────

function getConfig() {
  const url = localStorage.getItem('trolley_url');
  const key = localStorage.getItem('trolley_key');
  return (url && key) ? { url, key } : null;
}

function saveConfig(url, key) {
  localStorage.setItem('trolley_url', url);
  localStorage.setItem('trolley_key', key);
}

window.connect = async function() {
  const url = document.getElementById('cfgUrl').value.trim();
  const key = document.getElementById('cfgKey').value.trim();
  const status = document.getElementById('cfgStatus');
  const btn = document.getElementById('cfgConnect');

  if (!url || !key) {
    status.textContent = 'both fields required';
    status.className = 'config-status error';
    return;
  }
  btn.disabled = true;
  status.textContent = 'connecting...';
  status.className = 'config-status';

  try {
    const client = createClient(url, key);
    const { error } = await client.from('master_items').select('id').limit(1);
    if (error) throw error;
    saveConfig(url, key);
    status.textContent = 'connected!';
    status.className = 'config-status ok';
    setTimeout(() => init(), 400);
  } catch (e) {
    status.textContent = 'connection failed: ' + (e.message || 'check URL/key and that tables exist');
    status.className = 'config-status error';
    btn.disabled = false;
  }
};

window.openSettings = function() {
  if (!confirm('Disconnect from Supabase? Your data stays in the database.')) return;
  localStorage.removeItem('trolley_url');
  localStorage.removeItem('trolley_key');
  location.reload();
};

// ─── INIT ─────────────────────────────────────────────────────────────────────

async function init() {
  const cfg = getConfig();
  if (!cfg) {
    document.getElementById('configScreen').classList.remove('hidden');
    document.getElementById('app').style.display = 'none';
    return;
  }
  document.getElementById('configScreen').classList.add('hidden');
  document.getElementById('app').style.display = 'flex';

  supabase = createClient(cfg.url, cfg.key);
  setSyncStatus('syncing');
  await loadAll();
  setSyncStatus('connected');

  supabase
    .channel('trolley-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'master_items' }, loadMaster)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'current_list' }, loadCurrent)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'order_map' }, loadOrderMap)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'trips' }, loadTrips)
    .subscribe();

  render();
}

function setSyncStatus(s) {
  const dot = document.getElementById('syncDot');
  dot.classList.remove('connected', 'syncing');
  if (s === 'connected') dot.classList.add('connected');
  if (s === 'syncing') dot.classList.add('syncing');
}

// ─── DATA LOADING ─────────────────────────────────────────────────────────────

async function loadAll() {
  await Promise.all([loadMaster(), loadCurrent(), loadOrderMap(), loadTrips()]);
}

async function loadMaster() {
  const { data, error } = await supabase.from('master_items').select('*');
  if (error) { console.error(error); return; }
  state.master = data || [];
  render();
}

async function loadCurrent() {
  const { data, error } = await supabase.from('current_list').select('*');
  if (error) { console.error(error); return; }
  state.current = data || [];
  render();
}

async function loadOrderMap() {
  const { data, error } = await supabase.from('order_map').select('*');
  if (error) { console.error(error); return; }
  state.orderMap = {};
  for (const row of (data || [])) state.orderMap[row.name] = row.score;
  render();
}

async function loadTrips() {
  const { data, error } = await supabase
    .from('trips')
    .select('*')
    .order('completed_at', { ascending: false });
  if (error) { console.error(error); return; }
  state.trips = data || [];
  render();
}

// ─── ORDER LEARNING ───────────────────────────────────────────────────────────

async function recordCollection(name, orderPos) {
  const alpha = 0.35;
  const existing = state.orderMap[name];
  const newScore = existing == null ? orderPos : (1 - alpha) * existing + alpha * orderPos;
  state.orderMap[name] = newScore;
  await supabase.from('order_map').upsert({ name, score: newScore });
}

function getOrderScore(name) {
  const n = name.toLowerCase().trim();
  return state.orderMap[n] != null ? state.orderMap[n] : 9999;
}

function hasLearnedOrder(name) {
  return state.orderMap[name.toLowerCase().trim()] != null;
}

function confidenceLevel(name) {
  if (state.orderMap[name.toLowerCase().trim()] == null) return 0;
  if (state.trips.length >= 5) return 2;
  if (state.trips.length >= 2) return 1;
  return 0;
}

function sortByRoute(items) {
  return [...items].sort((a, b) => {
    const sa = getOrderScore(a.name);
    const sb = getOrderScore(b.name);
    if (sa !== sb) return sa - sb;
    // tiebreaker: more frequently bought first
    const ta = a.times_bought || 0, tb = b.times_bought || 0;
    if (ta !== tb) return tb - ta;
    return a.name.localeCompare(b.name);
  });
}

// ─── VIEW SWITCHING ───────────────────────────────────────────────────────────

window.setView = function(v) {
  currentView = v;
  document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view' + v.charAt(0).toUpperCase() + v.slice(1)).classList.add('active');

  // Show/hide chrome
  const tripStats = document.getElementById('tripStats');
  const progressTrack = document.getElementById('progressTrack');
  const subTabs = document.getElementById('subTabs');
  const searchRow = document.getElementById('searchRow');
  const addInput = document.getElementById('addInput');
  const actionsRow = document.getElementById('actionsRow');

  if (v === 'trip') {
    tripStats.style.display = 'flex';
    progressTrack.style.display = 'block';
    subTabs.style.display = 'flex';
    searchRow.style.display = 'none';
    addInput.placeholder = 'quick add to trip...';
    actionsRow.style.display = 'flex';
  } else if (v === 'master') {
    tripStats.style.display = 'none';
    progressTrack.style.display = 'none';
    subTabs.style.display = 'none';
    searchRow.style.display = 'block';
    addInput.placeholder = 'add to master list...';
    actionsRow.style.display = 'none';
  } else if (v === 'history') {
    tripStats.style.display = 'none';
    progressTrack.style.display = 'none';
    subTabs.style.display = 'none';
    searchRow.style.display = 'none';
    addInput.placeholder = '';
    actionsRow.style.display = 'none';
  }

  render();
};

window.setTab = function(tab) {
  currentTab = tab;
  document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  render();
};

// ─── ACTIONS ──────────────────────────────────────────────────────────────────

window.addItem = async function() {
  const input = document.getElementById('addInput');
  const name = input.value.trim();
  if (!name) return;

  if (currentView === 'history') return;

  setSyncStatus('syncing');

  if (currentView === 'master') {
    // Add to master list only
    const existing = state.master.find(m => m.name.toLowerCase() === name.toLowerCase());
    if (existing) { showToast('already in master list'); setSyncStatus('connected'); return; }
    const { error } = await supabase.from('master_items').insert({ name });
    if (error) showToast('failed: ' + error.message);
  } else {
    // Trip view: add to master if not there, then add to current list
    let master = state.master.find(m => m.name.toLowerCase() === name.toLowerCase());
    if (!master) {
      const { data, error } = await supabase
        .from('master_items')
        .insert({ name })
        .select()
        .single();
      if (error) { showToast('failed: ' + error.message); setSyncStatus('connected'); return; }
      master = data;
    }
    const existingOnList = state.current.find(c => c.master_item_id === master.id && !c.collected_at);
    if (existingOnList) {
      // Bump quantity
      await supabase.from('current_list')
        .update({ quantity: existingOnList.quantity + 1 })
        .eq('id', existingOnList.id);
    } else {
      await supabase.from('current_list').insert({
        master_item_id: master.id,
        name: master.name,
        quantity: 1,
      });
    }
  }

  input.value = '';
  setSyncStatus('connected');
  input.focus();
};

window.addToTrip = async function(masterId) {
  const master = state.master.find(m => m.id === masterId);
  if (!master) return;
  setSyncStatus('syncing');

  const existing = state.current.find(c => c.master_item_id === masterId && !c.collected_at);
  if (existing) {
    await supabase.from('current_list')
      .update({ quantity: existing.quantity + 1 })
      .eq('id', existing.id);
  } else {
    await supabase.from('current_list').insert({
      master_item_id: masterId,
      name: master.name,
      quantity: 1,
    });
  }
  setSyncStatus('connected');
};

window.adjustQty = async function(currentId, delta) {
  const item = state.current.find(c => c.id === currentId);
  if (!item) return;
  const newQty = Math.max(1, item.quantity + delta);
  if (newQty === item.quantity) return;
  setSyncStatus('syncing');
  await supabase.from('current_list').update({ quantity: newQty }).eq('id', currentId);
  setSyncStatus('connected');
};

window.adjustMasterQty = async function(masterId, delta) {
  // Adjust quantity of master item on current list, adding if needed
  const master = state.master.find(m => m.id === masterId);
  if (!master) return;
  const onList = state.current.find(c => c.master_item_id === masterId && !c.collected_at);
  setSyncStatus('syncing');
  if (!onList && delta > 0) {
    await supabase.from('current_list').insert({
      master_item_id: masterId,
      name: master.name,
      quantity: 1,
    });
  } else if (onList) {
    const newQty = onList.quantity + delta;
    if (newQty <= 0) {
      await supabase.from('current_list').delete().eq('id', onList.id);
    } else {
      await supabase.from('current_list').update({ quantity: newQty }).eq('id', onList.id);
    }
  }
  setSyncStatus('connected');
};

window.toggleCollected = async function(id) {
  const item = state.current.find(i => i.id === id);
  if (!item) return;
  setSyncStatus('syncing');
  if (!item.collected_at) {
    await supabase.from('current_list').update({
      collected_at: new Date().toISOString(),
      need_more: false,
    }).eq('id', id);
    await recordCollection(item.name.toLowerCase().trim(), currentTripOrder++);
  } else {
    await supabase.from('current_list').update({ collected_at: null }).eq('id', id);
    currentTripOrder = Math.max(0, currentTripOrder - 1);
  }
  setSyncStatus('connected');
  setTimeout(checkAllCollected, 600);
};

window.toggleNeedMore = async function(id) {
  const item = state.current.find(i => i.id === id);
  if (!item) return;
  setSyncStatus('syncing');
  await supabase.from('current_list').update({ need_more: !item.need_more }).eq('id', id);
  setSyncStatus('connected');
};

window.removeFromList = async function(id) {
  setSyncStatus('syncing');
  await supabase.from('current_list').delete().eq('id', id);
  setSyncStatus('connected');
};

window.removeFromMaster = async function(id) {
  if (!confirm('Remove this from your master list permanently?')) return;
  setSyncStatus('syncing');
  await supabase.from('master_items').delete().eq('id', id);
  setSyncStatus('connected');
};

window.clearCollected = async function() {
  const collected = state.current.filter(i => i.collected_at);
  if (!collected.length) { showToast('nothing collected yet'); return; }
  setSyncStatus('syncing');
  await supabase.from('current_list').delete().not('collected_at', 'is', null);
  setSyncStatus('connected');
  showToast(`cleared ${collected.length} item${collected.length > 1 ? 's' : ''}`);
};

window.completeTrip = function() {
  const collected = state.current.filter(i => i.collected_at);
  if (collected.length === 0) {
    showToast('collect items first');
    return;
  }
  document.getElementById('tripSummary').textContent =
    `Save trip with ${collected.length} item${collected.length !== 1 ? 's' : ''}? Trolley will update its learned route.`;
  document.getElementById('tripComplete').classList.add('show');
};

window.confirmCompleteTrip = async function() {
  const collected = state.current.filter(i => i.collected_at);
  if (!collected.length) { closeTripComplete(); return; }

  setSyncStatus('syncing');

  // Save to trips
  const tripItems = collected.map(i => ({
    name: i.name,
    quantity: i.quantity,
    collected_at: i.collected_at,
  }));
  const totalQty = collected.reduce((s, i) => s + i.quantity, 0);

  await supabase.from('trips').insert({
    item_count: collected.length,
    total_qty: totalQty,
    items: tripItems,
  });

  // Increment times_bought on master items
  for (const c of collected) {
    if (c.master_item_id) {
      const master = state.master.find(m => m.id === c.master_item_id);
      if (master) {
        await supabase.from('master_items')
          .update({ times_bought: (master.times_bought || 0) + 1 })
          .eq('id', c.master_item_id);
      }
    }
  }

  // Remove collected items from current list
  await supabase.from('current_list').delete().not('collected_at', 'is', null);
  currentTripOrder = 0;

  setSyncStatus('connected');
  closeTripComplete();
  showToast('trip saved to history');
};

window.closeTripComplete = function() {
  document.getElementById('tripComplete').classList.remove('show');
};

window.deleteTrip = async function(id) {
  if (!confirm('Delete this trip? Route data already learned from it stays.')) return;
  setSyncStatus('syncing');
  await supabase.from('trips').delete().eq('id', id);
  setSyncStatus('connected');
  showToast('trip deleted');
};

window.toggleTripExpand = function(id) {
  document.getElementById('trip-' + id).classList.toggle('expanded');
};

function checkAllCollected() {
  const active = state.current.filter(i => !i.collected_at);
  if (active.length === 0 && state.current.length > 0) {
    completeTrip();
  }
}

// ─── RENDER ───────────────────────────────────────────────────────────────────

function render() {
  // Always update stats (even when hidden, harmless)
  const total = state.current.length;
  const collected = state.current.filter(i => i.collected_at).length;
  const needMore = state.current.filter(i => i.need_more).length;
  const totalQty = state.current.reduce((s, i) => s + i.quantity, 0);

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statCollected').textContent = collected;
  document.getElementById('statNeedMore').textContent = needMore;
  document.getElementById('statQty').textContent = totalQty;
  const pct = total > 0 ? Math.round((collected / total) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';

  if (currentView === 'trip') renderTrip();
  else if (currentView === 'master') renderMaster();
  else if (currentView === 'history') renderHistory();
}

function renderTrip() {
  const wrap = document.getElementById('listWrap');
  let visible = state.current;
  if (currentTab === 'needed') visible = visible.filter(i => i.need_more);
  if (currentTab === 'collected') visible = visible.filter(i => i.collected_at);

  const pending = sortByRoute(visible.filter(i => !i.collected_at));
  const done = sortByRoute(visible.filter(i => i.collected_at));

  if (visible.length === 0) {
    wrap.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🛒</div>
        <div class="empty-title">${currentTab === 'all' ? 'trip is empty' : 'nothing here'}</div>
        <div class="empty-sub">${currentTab === 'all' ? 'add items, or pick from your master list' : ''}</div>
      </div>`;
    return;
  }

  let html = '';
  if (pending.length) {
    const hasLearned = pending.some(i => hasLearnedOrder(i.name));
    html += `<div class="section-label">${hasLearned ? 'sorted by route' : 'to collect'}</div>`;
    html += pending.map(item => tripItemHTML(item)).join('');
  }
  if (done.length) {
    html += `<div class="section-label">collected</div>`;
    html += done.map(item => tripItemHTML(item)).join('');
  }
  wrap.innerHTML = html;
}

function tripItemHTML(item) {
  const conf = confidenceLevel(item.name);
  const learned = hasLearnedOrder(item.name);
  const metaParts = [];
  if (learned && !item.collected_at) {
    const dots = '●'.repeat(conf + 1) + '○'.repeat(2 - conf);
    metaParts.push(`<span>${dots} learned</span>`);
  }
  if (item.need_more && !item.collected_at) {
    metaParts.push(`<span style="color:var(--danger)">⚠ need more</span>`);
  }

  return `
    <div class="item${item.collected_at ? ' collected' : ''}" onclick="toggleCollected(${item.id})">
      <div class="check-box"><span class="check-icon">✓</span></div>
      <div class="item-body">
        <div class="item-name">${escHtml(item.name)}</div>
        ${metaParts.length ? `<div class="item-meta">${metaParts.join('<span style="color:var(--border)">·</span>')}</div>` : ''}
      </div>
      <div class="item-actions" onclick="event.stopPropagation()">
        ${!item.collected_at ? `
          <div class="qty-controls">
            <button class="qty-btn" onclick="adjustQty(${item.id}, -1)">−</button>
            <span class="qty-val">${item.quantity}</span>
            <button class="qty-btn" onclick="adjustQty(${item.id}, 1)">+</button>
          </div>
          <button class="need-more-btn${item.need_more ? ' active' : ''}" onclick="toggleNeedMore(${item.id})">
            ${item.need_more ? '⚠' : '+'}
          </button>
        ` : `
          <span class="qty-badge">×${item.quantity}</span>
        `}
        <button class="btn-icon danger" onclick="removeFromList(${item.id})">✕</button>
      </div>
    </div>`;
}

function renderMaster() {
  const wrap = document.getElementById('listWrap');
  const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();

  let visible = state.master;
  if (search) visible = visible.filter(m => m.name.toLowerCase().includes(search));

  // Sort by route learning, then frequency
  visible = sortByRoute(visible);

  if (visible.length === 0) {
    wrap.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📋</div>
        <div class="empty-title">${search ? 'no matches' : 'master list empty'}</div>
        <div class="empty-sub">${search ? '' : 'add items below — they\'ll persist forever'}</div>
      </div>`;
    return;
  }

  let html = '';
  const hasLearned = visible.some(m => hasLearnedOrder(m.name));
  html += `<div class="section-label">${hasLearned ? 'sorted by your route · ' : ''}${visible.length} item${visible.length !== 1 ? 's' : ''}</div>`;

  html += visible.map(m => {
    const onList = state.current.find(c => c.master_item_id === m.id && !c.collected_at);
    const qty = onList ? onList.quantity : 0;
    const learned = hasLearnedOrder(m.name);
    const metaParts = [];
    if (m.times_bought > 0) metaParts.push(`bought ${m.times_bought}×`);
    if (learned) metaParts.push(`learned`);

    return `
      <div class="item">
        <div class="item-body">
          <div class="item-name">${escHtml(m.name)}</div>
          ${metaParts.length ? `<div class="item-meta">${metaParts.join(' · ')}</div>` : ''}
        </div>
        <div class="item-actions">
          ${qty > 0 ? `
            <div class="qty-controls">
              <button class="qty-btn" onclick="adjustMasterQty(${m.id}, -1)">−</button>
              <span class="qty-val">${qty}</span>
              <button class="qty-btn" onclick="adjustMasterQty(${m.id}, 1)">+</button>
            </div>
          ` : `
            <button class="need-btn" onclick="addToTrip(${m.id})">+ need</button>
          `}
          <button class="btn-icon danger" onclick="removeFromMaster(${m.id})">✕</button>
        </div>
      </div>`;
  }).join('');

  wrap.innerHTML = html;
}

function renderHistory() {
  const wrap = document.getElementById('listWrap');
  const trips = state.trips;

  // Compute stats
  const totalTrips = trips.length;
  const totalItems = trips.reduce((s, t) => s + (t.item_count || 0), 0);
  const avgItems = totalTrips > 0 ? (totalItems / totalTrips).toFixed(1) : '0';

  // Most-bought items across all trips
  const buyCount = {};
  for (const t of trips) {
    for (const i of (t.items || [])) {
      buyCount[i.name] = (buyCount[i.name] || 0) + (i.quantity || 1);
    }
  }
  const topItem = Object.entries(buyCount).sort((a, b) => b[1] - a[1])[0];

  // Days since last trip
  let daysSince = '–';
  if (trips.length > 0) {
    const last = new Date(trips[0].completed_at);
    const diff = Math.floor((Date.now() - last.getTime()) / (1000 * 60 * 60 * 24));
    daysSince = diff === 0 ? 'today' : diff === 1 ? '1 day' : `${diff} days`;
  }

  let html = `
    <div class="stats-grid">
      <div class="stats-card">
        <div class="stats-card-label">Total trips</div>
        <div class="stats-card-val">${totalTrips}</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-label">Items bought</div>
        <div class="stats-card-val">${totalItems}</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-label">Avg per trip</div>
        <div class="stats-card-val">${avgItems}</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-label">Last shop</div>
        <div class="stats-card-val" style="font-size:18px">${daysSince}</div>
      </div>
    </div>
    ${topItem ? `
      <div class="stats-card" style="margin-bottom:14px">
        <div class="stats-card-label">Most-bought item</div>
        <div class="stats-card-val" style="font-size:18px">${escHtml(topItem[0])}</div>
        <div class="stats-card-sub">${topItem[1]} units across all trips</div>
      </div>
    ` : ''}
  `;

  if (trips.length === 0) {
    html += `
      <div class="empty">
        <div class="empty-icon">📦</div>
        <div class="empty-title">no trips yet</div>
        <div class="empty-sub">complete your first trip and it'll show up here</div>
      </div>`;
  } else {
    html += `<div class="section-label">trip history</div>`;
    html += trips.map(t => {
      const date = new Date(t.completed_at);
      const dateStr = date.toLocaleDateString('en-GB', {
        weekday: 'short', day: 'numeric', month: 'short'
      });
      const timeStr = date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      const items = t.items || [];
      return `
        <div class="trip-card" id="trip-${t.id}">
          <div class="trip-header" onclick="toggleTripExpand(${t.id})">
            <div>
              <div class="trip-date">${dateStr} <span style="color:var(--text-dim);font-weight:400;font-size:12px">${timeStr}</span></div>
              <div class="trip-summary">${t.item_count} item${t.item_count !== 1 ? 's' : ''} · ${t.total_qty} total</div>
            </div>
            <button class="trip-delete" onclick="event.stopPropagation();deleteTrip(${t.id})">delete</button>
          </div>
          <div class="trip-items">
            ${items.map(i => `
              <div class="trip-item-line">
                <span class="trip-item-name">${escHtml(i.name)}</span>
                <span class="trip-item-qty">×${i.quantity}</span>
              </div>
            `).join('')}
          </div>
        </div>`;
    }).join('');
  }

  wrap.innerHTML = html;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
window.showToast = showToast;

init();
</script>
</body>
</html>
